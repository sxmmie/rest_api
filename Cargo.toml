[package]
name = "rest_api"
version = "0.1.0"
edition = "2024"

[dependencies]
# Async functions
tokio = { version = "1.36.0", features = ["full"] }

# Web server
axum = "0.7.4"

# JSON parsing
serde_json = "1.0.113"
serde = { version = "1.0.196", features = ["derive"] }

# DB
sqlx = { version = "0.7.3", features = [
    "postgres",
    "macros",
    "runtime-tokio-native-tls",
] }
